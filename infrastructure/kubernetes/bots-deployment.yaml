apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-bot
  namespace: sylvara
  labels: { app: whatsapp-bot }
spec:
  replicas: 2
  selector:
    matchLabels: { app: whatsapp-bot }
  template:
    metadata:
      labels: { app: whatsapp-bot }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: whatsapp-bot
          image: ghcr.io/gajetoso/paper/whatsapp-bot:latest
          ports: [{ containerPort: 4100 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 4100 }
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-bot
  namespace: sylvara
spec:
  selector: { app: whatsapp-bot }
  ports: [{ port: 80, targetPort: 4100 }]
---
apiVersion: apps/v1
