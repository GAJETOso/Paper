# Template only — create the real secret with:
#   kubectl -n sylvara create secret generic platform-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=JWT_SECRET=... \
#     --from-literal=ANTHROPIC_API_KEY=... --from-literal=WHATSAPP_ACCESS_TOKEN=...
# or manage via ExternalSecrets/SealedSecrets. NEVER commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: sylvara
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@host:5432/sylvara"
  JWT_SECRET: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"
  WHATSAPP_ACCESS_TOKEN: "CHANGE_ME"
  WHATSAPP_APP_SECRET: "CHANGE_ME"
  WHATSAPP_VERIFY_TOKEN: "CHANGE_ME"
  TELEGRAM_BOT_TOKEN: "CHANGE_ME"
