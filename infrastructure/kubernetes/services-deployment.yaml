apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm
  namespace: sylvara
  labels: { app: crm }
spec:
  replicas: 2
  selector:
    matchLabels: { app: crm }
  template:
    metadata:
      labels: { app: crm }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: crm
          image: ghcr.io/gajetoso/paper/service-crm:latest
          ports: [{ containerPort: 4400 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 4400 }
---
apiVersion: v1
kind: Service
metadata:
  name: crm
  namespace: sylvara
spec:
  selector: { app: crm }
  ports: [{ port: 4400, targetPort: 4400 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sustainability
  namespace: sylvara
  labels: { app: sustainability }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sustainability }
  template:
    metadata:
      labels: { app: sustainability }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: sustainability
          image: ghcr.io/gajetoso/paper/service-sustainability:latest
          ports: [{ containerPort: 4430 }]
          envFrom:
            - configMapRef: { name: platform-config }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 4430 }
---
apiVersion: v1
kind: Service
metadata:
  name: sustainability
  namespace: sylvara
spec:
  selector: { app: sustainability }
  ports: [{ port: 80, targetPort: 4430 }]
